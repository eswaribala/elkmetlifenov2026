input {
  file {
    path => "/opt/elastic-lab/csv/tmax11.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
  }
}

filter {
  if [message] =~ /^\s*$/ { drop {} }
  csv {
    source => "message"
    columns => ["serial_no", "date_of_record", "stock_quote"]
    separator => ","
  }
  mutate {
    convert => {
      "serial_no" => "integer"
      "stock_quote" => "float"
    }
  }
  date {
    match => ["date_of_record", "dd/MM/yyyy"]
    target => "stock_date"
  }
}

output {
  elasticsearch {
    hosts => ["https://192.168.122.227:9200"]
    user => "elastic"
    password => "${ES_PASSWORD}"

    ssl_certificate_authorities => [
      "/etc/logstash/certs/http_ca.crt"
    ]

    index => "csv-stock-data"
    document_id => "%{serial_no}"
    ilm_enabled => false
  }

  stdout {
    codec => rubydebug
  }
}
