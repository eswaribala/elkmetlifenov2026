Step 1 — Create the Logstash pipeline
On your current Ubuntu machine (es-node1, where Kibana is running), execute:
sudo nano /etc/logstash/conf.d/filebeat.conf


Paste the following configuration:
input {
  beats {
    host => "0.0.0.0"
    port => 5044
  }
}

filter {
  if [message] {
    mutate {
      add_field => {
        "lab_source" => "filebeat"
      }
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }
}


This initial pipeline receives Filebeat events on TCP port 5044, adds a field, and prints the results to Logstash logs for verification. It does not yet send data to Elasticsearch.

Save using Ctrl+O, Enter, then Ctrl+X.
Step 2 — Validate and start Logstash
Run:
sudo /usr/share/logstash/bin/logstash \
  --path.settings /etc/logstash \
  --config.test_and_exit


Expected result:
Configuration OK


Then start Logstash:
sudo systemctl enable --now logstash
sudo systemctl status logstash --no-pager


Verify that port 5044 is listening:
sudo ss -lntp | grep 5044


Expected: a Java process listening on TCP port 5044.
Step 3 — Configure Filebeat
Because Filebeat and Logstash are currently on the same machine, use 127.0.0.1.

Open:
sudo nano /etc/filebeat/filebeat.yml


Configure the following input, adding it beneath an existing filebeat.inputs: heading if one is already present:
filebeat.inputs:
  - type: filestream
    id: application-logs
    enabled: true
    paths:
      - /var/log/elastic-lab/*.log


Disable the existing output.elasticsearch section and enable:
output.logstash:
  hosts: ["127.0.0.1:5044"]


Ensure only one output is enabled. This follows Elastic's documented Filebeat-to-Logstash setup. 
Beats+1

Step 4 — Generate a test log
Run:
sudo mkdir -p /var/log/elastic-lab

echo "2026-11-02 INFO Insurance claim received" \
  | sudo tee -a /var/log/elastic-lab/app.log


Then validate and start Filebeat:
sudo filebeat test config
sudo filebeat test output

sudo systemctl enable --now filebeat
sudo systemctl status filebeat --no-pager


Step 5 — Verify log ingestion
Run:
sudo journalctl -u logstash -f


Look for an event containing:
message => "2026-11-02 INFO Insurance claim received"
lab_source => "filebeat"
